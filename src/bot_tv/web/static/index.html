<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0e0d12" />
    <meta name="description" content="Panel de control del bot de Twitch" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bot-tv" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>bot-tv</title>

    <script>
      try {
        const savedFontSize = localStorage.getItem('font-size') || '14.5px';
        document.documentElement.style.setProperty('--font-size', savedFontSize);
      } catch (_) {}
    </script>

    <!-- Import Map -->
    <script type="importmap">
      {
        "imports": {
          "preact": "/static/vendor/preact.module.js",
          "preact/hooks": "/static/vendor/preact-hooks.module.js",
          "htm": "/static/vendor/htm.module.js",
          "preact-setup": "/static/lib/preact-setup.js",
          "lib/utils": "/static/lib/utils.js"
        }
      }
    </script>

    <!-- Preload de módulos críticos -->
    <link rel="modulepreload" href="/static/vendor/preact.module.js" />
    <link rel="modulepreload" href="/static/vendor/preact-hooks.module.js" />
    <link rel="modulepreload" href="/static/vendor/htm.module.js" />
    <link rel="modulepreload" href="/static/lib/preact-setup.js" />
    <link rel="modulepreload" href="/static/lib/utils.js" />
    <link rel="modulepreload" href="/static/app.js" />
    <link rel="modulepreload" href="/static/components/App.js" />
    <link rel="modulepreload" href="/static/hooks/useWebSocket.js" />
    <link rel="modulepreload" href="/static/components/stream/StreamTab.js" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/buttons.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/connection-indicator.css" />
    <link rel="stylesheet" href="/static/css/tabs.css" />
    <link rel="stylesheet" href="/static/css/chat.css" />
    <link rel="stylesheet" href="/static/css/followers.css" />
    <link rel="stylesheet" href="/static/css/history.css" />
    <link rel="stylesheet" href="/static/css/agent.css" />
    <link rel="stylesheet" href="/static/css/actions.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />
    <link rel="stylesheet" href="/static/css/settings.css" />
    <link rel="stylesheet" href="/static/css/toasts.css" />
    <link rel="stylesheet" href="/static/css/modals.css" />
    <link rel="stylesheet" href="/static/css/tooltip.css" />
    <link rel="stylesheet" href="/static/css/responsive.css" />
    <link rel="stylesheet" href="/static/css/stream.css" />
    <script src="https://player.twitch.tv/js/embed/v1.js" defer></script>
  </head>
  <body>
    <div id="app">
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #0e0d12;
        "
      >
        <div
          style="
            width: 32px;
            height: 32px;
            border: 3px solid rgba(130, 87, 229, 0.15);
            border-top: 3px solid #8257e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
          "
        ></div>
      </div>
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>

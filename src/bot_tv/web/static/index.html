<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#08070d" />
    <style>
      html,
      body {
        margin: 0;
        background: #08070d;
      }
    </style>
    <meta name="description" content="Panel de control del bot de Twitch" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bot-tv" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>bot-tv</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://player.twitch.tv/js/embed/v1.js" defer></script>
  </head>
  <body>
    <div id="app">
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          min-width: 0;
          background: #08070d;
        "
      >
        <div
          style="
            width: 32px;
            height: 32px;
            border: 3px solid rgba(130, 87, 229, 0.15);
            border-top: 3px solid #8257e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
          "
        ></div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

[project]
name = "bot-tv"
version = "0.2.0"
description = "Bot de Twitch"
authors = [{ name = "Leo" }]
requires-python = ">=3.14,<4.0"
dependencies = [
    "twitchio[starlette]==3.2.2",
    "asqlite==2.0.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "keyboard==0.13.5",
    "prompt-toolkit==3.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_tv"]

[project.scripts]
bot-tv = "bot_tv.main:main"
bot-setup = "bot_tv.setup:setup"

# ── Ruff ────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (ordenamiento de imports)
    "B",   # flake8-bugbear (errores comunes)
    "UP",  # pyupgrade (modernización de sintaxis)
    "SIM", # flake8-simplify (simplificaciones)
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ── Pyrefly ─────────────────────────────────────────────────────────
[tool.pyrefly]
search-path = ["src"]

[dependency-groups]
dev = [
    "ruff==0.15.17",
    "pyrefly==1.0.0",
    "types-keyboard==0.13.2.20260508",
    "types-requests==2.33.0.20260518",
]

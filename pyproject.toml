[project]
name = "bot-tv"
version = "0.10.0"
description = "Bot de Twitch"
authors = [{ name = "leo-kleis" }]
requires-python = ">=3.14,<4.0"
dependencies = [
    "twitchio[starlette]==3.2.2",
    "asyncpg==0.31.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "keyboard==0.13.5",
    "prompt-toolkit==3.0.52",
    "google-antigravity==0.1.7",

    "rich==15.0.0",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "cryptography==49.0.0",
]

[project.urls]
Repository = "https://github.com/leo-kleis/bot-tv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_tv"]

[project.scripts]
bot-tv = "bot_tv.main:main"
bot-web = "bot_tv.web_main:main"
bot-setup = "bot_tv.setup:setup"

# ── Ruff ────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (ordenamiento de imports)
    "B",   # flake8-bugbear (errores comunes)
    "UP",  # pyupgrade (modernización de sintaxis)
    "SIM", # flake8-simplify (simplificaciones)
    "S",   # flake8-bandit (análisis de seguridad)
    "T20", # flake8-print (prohibir print)
    "N",   # pep8-naming (estilo de nombres)
    "A",   # flake8-builtins (evitar sobreescribir builtins)
    "C4",  # flake8-comprehensions (simplificar comprensiones)
    "RUF", # ruff-specific rules (reglas específicas de ruff)
]
ignore = [
    "A001", # Permitir shadowing de builtins (ej. print = CONSOLE.print)
    "S311", # Permitir random estándar (no criptográfico)
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"extra/**/*.py" = [
    "T201",
    "T203",
    "S105",
    "S113",
] # Permitir print/input/urls/requests sin timeout en scripts interactivos
"src/bot_tv/agent/tools/chat.py" = [
    "S608",
] # Permitir f-string SQL query dinámico controlado
"src/bot_tv/database/repositories/*.py" = [
    "S608",
] # Permitir f-string SQL query dinámico controlado

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ── Pyrefly ─────────────────────────────────────────────────────────
[tool.pyrefly]
preset = "default"
project-includes = ["src/**/*.py"]

[dependency-groups]
dev = [
    "ruff==0.15.17",
    "pyrefly==1.0.0",
    "types-keyboard==0.13.2.20260508",
    "types-requests==2.33.0.20260518",
    "watchfiles==1.2.0",
]

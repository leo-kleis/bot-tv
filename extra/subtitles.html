<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtítulos en Vivo - bot-caption</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Outfit', sans-serif;
    }

    #container {
      position: absolute;
      bottom: 10%;
      left: 5%;
      right: 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
    }

    #subtitles-box {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.4;
      /* Borde de letra negro hiper-marcado para legibilidad en stream */
      text-shadow: 
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0px  4px 10px rgba(0,0,0,0.8);
      max-width: 90%;
      word-wrap: break-word;
      transition: opacity 0.4s ease, transform 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
    }

    #subtitles-box.active {
      opacity: 1;
      transform: translateY(0);
    }

    #subtitles-box .partial {
      color: #d1d5db; /* Gris claro para texto intermedio */
      font-weight: 400;
    }

    /* Pequeño indicador discreto del estado de conexión para configurar en OBS */
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>

  <div id="status">Desconectado</div>
  <div id="container">
    <div id="subtitles-box"></div>
  </div>

  <script>
    const subtitlesBox = document.getElementById('subtitles-box');
    const statusIndicator = document.getElementById('status');
    
    let ws = null;
    let fadeTimeout = null;
    const WS_URL = 'ws://localhost:9000/ws';
    const AUTO_HIDE_DELAY_MS = 4000; // Ocultar subtítulos después de 4s de inactividad

    function showStatus(text, duration = 3000) {
      statusIndicator.textContent = text;
      statusIndicator.style.opacity = '1';
      setTimeout(() => {
        statusIndicator.style.opacity = '0';
      }, duration);
    }

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        showStatus('Conectado a bot-caption');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          updateSubtitles(data.text, data.is_final);
        } catch (e) {
          console.error("Error procesando mensaje WebSocket:", e);
        }
      };

      ws.onclose = () => {
        showStatus('Conexión perdida. Reconectando...');
        // Intenta reconectar en 2 segundos
        setTimeout(connect, 2000);
      };

      ws.onerror = (error) => {
        console.error("Error WebSocket:", error);
      };
    }

    function updateSubtitles(text, isFinal) {
      // Limpiar cualquier timeout activo para ocultar
      if (fadeTimeout) {
        clearTimeout(fadeTimeout);
      }

      if (!text || text.trim() === '') {
        return;
      }

      // Renderizar el texto
      if (isFinal) {
        subtitlesBox.innerHTML = `<span>${text}</span>`;
      } else {
        subtitlesBox.innerHTML = `<span class="partial">${text}</span>`;
      }

      // Animación de entrada / mantener activo
      subtitlesBox.classList.add('active');

      // Si es texto final, iniciar temporizador para ocultar si no se habla más
      if (isFinal) {
        fadeTimeout = setTimeout(() => {
          subtitlesBox.classList.remove('active');
        }, AUTO_HIDE_DELAY_MS);
      }
    }

    // Iniciar conexión al cargar
    connect();
  </script>
</body>
</html>
